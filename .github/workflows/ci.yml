name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest -m "not integration" --cov=polyocr --cov-report=term-missing
      - run: python -m build
      - name: Verify the built distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

  languages:
    # Checks the language catalogue against real PaddleOCR metadata. This needs
    # the `ocr` extra but downloads no model weights.
    name: language catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,ocr]"
      - run: python -m pytest tests/integration/test_language_catalogue.py -m integration -q

  container:
    name: container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t polyocr-service:ci .
      - name: Check the image starts and serves /v1/health
        run: |
          docker run -d --name polyocr-ci \
            -e POLYOCR_AUTH_ENABLED=false \
            -p 8000:8000 polyocr-service:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/v1/health; then
              echo "health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "service did not become healthy"
          docker logs polyocr-ci
          exit 1
