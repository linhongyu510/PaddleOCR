<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
        }

        .header-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(255, 255, 255, 0.2));
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            min-height: 600px;
        }

        .sidebar {
            width: 50%;
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
            padding: 20px;
        }

        .content-area {
            width: 50%;
            padding: 20px;
            padding-top: 2px;
            background: white;
            display: flex;
            flex-direction: column;
            min-height: 600px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .textarea-control {
            min-height: 120px;
            resize: vertical;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .result-area {

            border-radius: 12px;
            padding: 15px;
            min-height: 400px;
            flex: 1;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #374151;
        }

        .result-content {
            background: white;
            border-radius: 8px;
            padding: 15px;
            min-height: 200px;
            border: 1px solid #e5e7eb;
            flex: 1;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            flex-direction: column;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;

        .success {

    <script>
        let currentTranslationResult = null;

        function toggleConfig() {
            const configForm = document.getElementById('configForm');
            configForm.classList.toggle('active');
        }

        function updateConfig() {
            const apiKey = document.getElementById('apiKey').value;
            const modelName = document.getElementById('modelName').value;
            const baseUrl = document.getElementById('baseUrl').value;
            const promptTemplate = document.getElementById('promptTemplate').value;

            if (!apiKey) {
                showError('请输入API密钥');
                return;
            }

            const formData = new FormData();
            formData.append('api_key', apiKey);
            formData.append('model_name', modelName);
            formData.append('base_url', baseUrl);
            if (promptTemplate) {
                formData.append('prompt_template', promptTemplate);
            }

            fetch('/v1/translation/config', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 0) {
                    showSuccess('配置更新成功');
                } else {
                    showError(data.msg);
                }
            })
            .catch(error => {
                showError('配置更新失败: ' + error.message);
            });
        }

        function translateText() {
            const inputText = document.getElementById('inputText').value.trim();
            const sourceLanguage = document.getElementById('sourceLanguage').value;
            const targetLanguage = document.getElementById('targetLanguage').value;

            if (!inputText) {
                showError('请输入待翻译文本');
                return;
            }

            // 将输入文本按行分割
            const texts = inputText.split('\n').filter(line => line.trim());

            if (texts.length === 0) {
                showError('请输入有效的待翻译文本');
                return;
            }

            const translateBtn = document.getElementById('translateBtn');
            translateBtn.disabled = true;
            translateBtn.textContent = '翻译中...';

            showLoading('正在进行翻译...');

            const requestData = {
                original_texts: texts,
                source_language: sourceLanguage,
                target_language: targetLanguage
            };

            fetch('http://43.137.12.144:16110/v2/translate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer PolyNex-PolyOCR-2025xm'
                },
                body: JSON.stringify(requestData)
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Response data:', data);
                if (data.code === 0) {
                    currentTranslationResult = data.data;
                    displayTranslationResult(data.data, texts);
                } else {
                    showError(data.msg || '翻译失败');
                }
            })
            .catch(error => {
                console.error('Translation error:', error);
                showError('翻译失败: ' + (error.message || '未知错误'));
            })
            .finally(() => {
                translateBtn.disabled = false;
                translateBtn.textContent = '开始翻译';
            });
        }

        function displayTranslationResult(translatedTexts, originalTexts) {
            // 确保 translatedTexts 是数组
            if (!Array.isArray(translatedTexts)) {
                console.error('translatedTexts is not an array:', translatedTexts);
                showError('翻译结果格式错误');
                return;
            }
            
            let resultHtml = `
                <div style="padding: 20px;">
                    <div style="font-weight: 600; margin-bottom: 15px; color: #374151; font-size: 1.1rem;">🌐 翻译结果</div>
                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
                        <div style="font-weight: 600; margin-bottom: 10px; color: #374151;">翻译文本:</div>
                        <div class="text-result" style="white-space: pre-wrap; line-height: 1.6; color: #374151; max-height: 400px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.9rem;">
                            ${translatedTexts.map((text, index) => `${index + 1}. ${text}`).join('\n')}
                        </div>
                    </div>
                    <div style="text-align: center; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                        <button class="btn-copy-result" onclick="copyTranslationResult()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.3s ease;">📋 复制结果</button>
                        <button class="btn-download-result" onclick="downloadTranslationResult()" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.3s ease;">📥 下载结果</button>
                        <button class="btn-clear-result" onclick="clearResult()" style="background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.3s ease;">🗑️ 清空结果</button>
                    </div>
                </div>
            `;
            
            document.getElementById('resultContent').innerHTML = resultHtml;
        }

        function copyTranslationResult() {
            const resultContent = document.querySelector('#resultContent .text-result');
            if (resultContent) {
                const textToCopy = resultContent.textContent;
                
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showSuccess('翻译结果已复制到剪贴板');
                    }).catch(() => {
                        fallbackCopyTextToClipboard(textToCopy);
                    });
                } else {
                    fallbackCopyTextToClipboard(textToCopy);
                }
            } else {
                showError('未找到可复制的内容');
            }
        }

        function downloadTranslationResult() {
            if (!currentTranslationResult) {
                showError('没有可下载的结果');
                return;
            }

            const textContent = currentTranslationResult.join('\n');
            const sourceLanguage = document.getElementById('sourceLanguage').value;
            const targetLanguage = document.getElementById('targetLanguage').value;
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `translation_${sourceLanguage}_to_${targetLanguage}_${timestamp}.txt`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showSuccess('翻译结果已下载');
        }

        function clearResult() {
            document.getElementById('resultContent').innerHTML = `
                <div style="text-align: center; color: #94a3b8; padding: 60px 20px;">
                    <div style="font-size: 3rem; margin-bottom: 15px;">🌐</div>
                    <div>请输入待翻译文本后开始翻译</div>
                </div>
            `;
            currentTranslationResult = null;
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            clearResult();
        }

        function showLoading(message = '正在处理中...') {
            document.getElementById('resultContent').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>${message}</div>
                </div>
            `;
        }

        function showError(message) {
            document.getElementById('resultContent').innerHTML = `
                <div class="error">
                    <strong>错误:</strong> ${message}
                </div>
            `;
        }

        function showSuccess(message) {
            // 创建临时成功提示
            const successDiv = document.createElement('div');
            successDiv.className = 'success';
            successDiv.innerHTML = `<strong>成功:</strong> ${message}`;
            successDiv.style.position = 'fixed';
            successDiv.style.top = '20px';
            successDiv.style.right = '20px';
            successDiv.style.zIndex = '1000';
            successDiv.style.maxWidth = '300px';
            
            document.body.appendChild(successDiv);
            
            setTimeout(() => {
                document.body.removeChild(successDiv);
            }, 3000);
        }

        function fallbackCopyTextToClipboard(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            textArea.style.top = '-999999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            
            try {
                document.execCommand('copy');
                showSuccess('翻译结果已复制到剪贴板');
            } catch (err) {
                showError('复制失败，请手动复制');
            }
            
            document.body.removeChild(textArea);
        }

        // 监听输入变化，启用/禁用翻译按钮
        document.getElementById('inputText').addEventListener('input', function() {
            const translateBtn = document.getElementById('translateBtn');
            translateBtn.disabled = !this.value.trim();
        });

        // 页面加载时获取当前配置
        window.addEventListener('load', function() {
            fetch('/v1/translation/config')
            .then(response => response.json())
            .then(data => {
                if (data.code === 0) {
                    const config = data.data;
                    document.getElementById('apiKey').value = config.api_key;
                    document.getElementById('modelName').value = config.model_name;
                    document.getElementById('baseUrl').value = config.base_url;
                    document.getElementById('promptTemplate').value = config.prompt_template || '';
                }
            })
            .catch(error => {
                console.log('获取配置失败:', error);
            });
        });
    </script>
</body>
</html>
