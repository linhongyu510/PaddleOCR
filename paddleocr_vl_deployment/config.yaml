# PaddleOCR-VL 配置文件
server:
  host: "0.0.0.0"
  port: 8080
  server_ip: "183.250.90.218"

# PaddleOCR-VL 模型配置
model:
  use_doc_orientation_classify: true
  use_doc_unwarping: true
  use_layout_detection: true
  use_chart_recognition: true

# 推理加速配置
inference:
  backend: "vllm-server"
  server_url: "http://183.250.90.218:8118/v1"
  max_concurrency: 4

# 服务化部署配置
serving:
  visualize: true
  max_num_input_imgs: 10
  prettify_markdown: true
  show_formula_number: false

# 性能调优配置
performance:
  gpu_memory_utilization: 0.8
  max_num_seqs: 128
  temperature: 0.1
  top_p: 0.9
  repetition_penalty: 1.0
